version: '3.9'
services:
  backend:
    build: .
    container_name: backend-service
    ports:
      - '80:80'
    # command:
    #   /bin/sh -c "/app/conf-replica.sh"
    depends_on:
      db_master:
        condition: service_healthy  
      db_slave_1:
        condition: service_healthy 
      db_slave_2:
        condition: service_healthy 

  db_master:
    image: postgres:16.3-bookworm
    container_name: pgmaster
    restart: always
    user: postgres
    environment:
      - POSTGRES_user=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
      - TZ=Europe/Moscow
    ports:
      - '5431:5432'
    # volumes:
    #   - pgmaster:/var/lib/postgresql/data:z
    #   - ./pgconf/master/my-postgres.conf:/var/lib/postgresql/data/postgresql.conf
    #   - ./pgconf/master/pg-hba.conf:/var/lib/postgresql/data/pg_hba.conf
    volumes:
     - pgmaster:/var/lib/postgresql/data:z
    command: postgres -c wal_level=logical 
      # && postgres -c synchronous_standby_names='pgslave_1'
      # && postgres -c synchronous_commit=on
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  db_slave_1:
    image: postgres:16.3-bookworm
    container_name: pgslave_1
    restart: always
    user: postgres
    environment:
      - POSTGRES_user=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
      - TZ=Europe/Moscow
    ports:
      - '6431:5432'
    volumes:
      - pgslave_1:/var/lib/postgresql/data:z
    #   # - ./pgconf/slave1/my-postgres.conf:/etc/postgresql/postgresql.conf
    depends_on:
      - db_master
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  db_slave_2:
    image: postgres:16.3-bookworm
    container_name: pgslave_2
    restart: always
    user: postgres
    environment:
      - POSTGRES_user=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=social_network
      - TZ=Europe/Moscow
    ports:
      - '6432:5432'
    volumes:
      - pgslave_2:/var/lib/postgresql/data:z
    #   # - ./pgconf/slave2/my-postgres.conf:/etc/postgresql/postgresql.conf
    depends_on:
      - db_master
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    container_name: redis_ct
    ports: 
      - '6379:6379'
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "","ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./data/prometheus/config:/etc/prometheus/
      - ./data/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # - '-storage.local.path=/prometheus'
      - '--storage.tsdb.path=/prometheus'
      # - '--alertmanager.url=http://alertmanager:9093'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    expose:
      - 9090
    ports:
      - 9090:9090
    links:
      - cadvisor:cadvisor
      - node-exporter:node-exporter

  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    user: root
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    expose:
      - 9100

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: monitoring_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - 8080
  
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    links:
      - prometheus:prometheus
    volumes:
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=MYPASSWORT
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SMTP_ENABLED=false
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=@gmail.com
      - GF_SMTP_PASSWORD=mypassword
      - GF_SMTP_FROM_ADDRESS=myaddress@gmail.com
volumes:
  pgmaster:
  pgslave_1:
  pgslave_2:
networks:
  host:
    external: true     